<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Samarth ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, serif;
    background: #fff5f7;
    color: #4b2630;
    overflow: hidden;
}

/* SLIDES */

.slide {
    display: none;
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    padding: 25px 18px 70px;
    text-align: center;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    animation: fade 0.7s ease;
}

.slide.active {
    display: flex;
}

@keyframes fade {
    from {
        opacity: 0;
        transform: translateX(20px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* TEXT */

h1 {
    font-size: 36px;
    margin: 10px;
}

h2 {
    font-size: 29px;
    margin: 10px;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

.heart {
    font-size: 48px;
}

/* BUTTON */

button {
    border: none;
    padding: 13px 22px;
    border-radius: 30px;
    background: #d85b79;
    color: white;
    font-size: 17px;
    margin-top: 12px;
    cursor: pointer;
    font-family: Georgia, serif;
}

button:active {
    transform: scale(0.95);
}

/* PASSWORD */

#pinDisplay {
    font-size: 27px;
    letter-spacing: 7px;
    margin: 15px;
    min-height: 35px;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 65px);
    gap: 10px;
    justify-content: center;
    margin-top: 5px;
}

.key {
    width: 65px;
    height: 55px;
    padding: 0;
    margin: 0;
    font-size: 20px;
    background: #d85b79;
}

.zero {
    grid-column: 2;
}

.clear {
    background: #777;
    margin-top: 15px;
}

#wrong {
    color: #c03955;
    font-weight: bold;
    min-height: 25px;
    margin-top: 8px;
}

/* CAKE */

.cake {
    font-size: 110px;
    margin: 5px;
}

.flame {
    display: inline-block;
    font-size: 55px;
    transition: 0.7s;
}

.flame.off {
    opacity: 0;
    transform: scale(0);
}

.hidden {
    display: none !important;
}

.message {
    font-size: 21px;
    margin-top: 15px;
    font-weight: bold;
}

/* NOTE */

.note {
    width: 92%;
    max-width: 700px;
    max-height: 68vh;
    overflow-y: auto;
    background: rgba(255,255,255,0.9);
    padding: 22px;
    border-radius: 25px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

.note p {
    font-size: 16px;
    text-align: left;
    line-height: 1.55;
}

/* PHOTO */

.photo {
    width: 94%;
    max-width: 850px;
    max-height: 70vh;
    object-fit: contain;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}

/* SPOTIFY */

.spotify-button {
    display: inline-block;
    text-decoration: none;
}

.spotify-button button {
    background: #d85b79;
}

/* CONFETTI */

.confetti {
    position: fixed;
    top: -30px;
    font-size: 22px;
    animation: fall 3s linear forwards;
    z-index: 100;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

/* MOBILE */

@media (max-width: 500px) {

    h1 {
        font-size: 31px;
    }

    h2 {
        font-size: 26px;
    }

    p {
        font-size: 17px;
    }

    .cake {
        font-size: 90px;
    }

    .note {
        max-height: 65vh;
        padding: 18px;
    }

    .note p {
        font-size: 15px;
    }

}

</style>
</head>

<body>


<!-- ===================================================== -->
<!-- SLIDE 1 : SECRET PASSWORD -->
<!-- ===================================================== -->

    <div class="heart">❤️</div>

    </p>

        <b>🔐 Enter the secret code</b>

        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>

        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>

        <button class="key zero" onclick="pressKey('0')">0</button>

    </div>

    <button class="clear" onclick="clearPin()">
        Clear
    </button>

    <div id="wrong"></div>

<!-- SLIDE 2 : BIRTHDAY -->
<!-- ===================================================== -->

<section class="slide" id="slide2">

    <div class="heart">
        🎈🎉❤️
    </div>

    <h1>
        Happiest Birthday<br>
        Samarth ❤️
    </h1>

    <p>
        Today is all about you! 🥳

    <button onclick="nextSlide()">
