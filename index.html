<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Make a Wish ✨</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fff6f8;
    color: #4b2630;
    font-family: Georgia, serif;
    text-align: center;
}

.page {
    min-height: 100vh;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.page.active {
    display: flex;
}

/* ================= PASSWORD PAGE ================= */

#lockPage h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

#lockPage p {
    font-size: 20px;
}

#display {
    width: 290px;
    height: 55px;
    background: white;
    border: 2px solid #d9577c;
    border-radius: 15px;
    margin: 15px 0 25px;
    font-size: 25px;
    letter-spacing: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 75px);
    gap: 12px;
}

.keypad button {
    width: 75px;
    height: 60px;
    border: none;
    border-radius: 16px;
    background: #d9577c;
    color: white;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
}

.keypad button:active {
    transform: scale(0.90);
}

.clear {
    background: #777 !important;
}

.enter {
    background: #8c3150 !important;
}

#error {
    color: #d33;
    margin-top: 15px;
    min-height: 20px;
}


/* ================= WISH PAGE ================= */

#wishPage h1 {
    font-size: 40px;
    margin-bottom: 25px;
}

.cake {
    position: relative;
    width: 220px;
    height: 170px;
    margin-bottom: 20px;
}

.cakeBody {
    position: absolute;
    left: 15px;
    top: 60px;
    width: 190px;
    height: 90px;
    background: #f5ad42;
    border-radius: 0 0 35px 35px;
}

.cakeTop {
    position: absolute;
    left: 15px;
    top: 35px;
    width: 190px;
    height: 70px;
    background: #ffd477;
    border-radius: 50%;
    z-index: 2;
}

.cream {
    position: absolute;
    left: 15px;
    top: 48px;
    width: 190px;
    height: 30px;
    background: #fff4d6;
    border-radius: 50%;
    z-index: 3;
}

.candle {
    position: absolute;
    top: -5px;
    width: 18px;
    height: 55px;
    border-radius: 4px;
    z-index: 5;
}

.candle1 {
    left: 65px;
    background: #54b9e8;
}

.candle2 {
    left: 101px;
    background: #ed6c98;
}

.candle3 {
    left: 137px;
    background: #f3a341;
}

.flame {
    position: absolute;
    width: 20px;
    height: 30px;
    top: -35px;
    left: -1px;
    background: #ff9d00;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    transition: 0.3s;
}

.flame.off {
    opacity: 0;
    transform: rotate(-45deg) scale(0);
}

.fire {
    font-size: 80px;
    margin-bottom: 10px;
    transition: 0.3s;
}

.fire.off {
    opacity: 0;
    transform: scale(0);
}

.instruction {
    font-size: 21px;
    margin: 10px;
}

.blowButton {
    border: none;
    background: #d9577c;
    color: white;
    padding: 18px 35px;
    border-radius: 40px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

.blowButton:active {
    transform: scale(0.93);
}

#micStatus {
    font-size: 15px;
    color: #777;
    margin-top: 15px;
}


/* ================= PHOTO PAGE ================= */

#photoPage h1 {
    font-size: 34px;
    margin-bottom: 20px;
}

.photoFrame {
    width: 90%;
    max-width: 380px;
    height: 500px;
    background: white;
    padding: 10px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.18);
}

.photoFrame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
    transition: opacity 0.5s;
}

.photoMessage {
    font-size: 20px;
    margin-top: 20px;
}

@media(max-width:400px) {
    .photoFrame {
        height: 430px;
    }
}
</style>
</head>


<body>


<!-- ==================================================
     PAGE 1 : PASSWORD
================================================== -->

<section id="lockPage" class="page active">

    <h1>🔐 A Little Surprise ✨</h1>

    <p>Enter the secret code</p>

    <div id="display"></div>

    <div class="keypad">

        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>

        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>

        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>

        <button class="clear" onclick="clearCode()">C</button>
        <button onclick="addNumber('0')">0</button>
        <button class="enter" onclick="checkPassword()">✓</button>

    </div>

    <div id="error"></div>

</section>

     PAGE 2 : MAKE A WISH
================================================== -->

    <h1>Make a Wish ✨</h1>

        <div class="candle candle1">
            <div class="flame"></div>
